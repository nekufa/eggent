name: Build Image

on:
  push:
    branches: [main]
    tags:
      - 'v*'

concurrency:
  group: build-image

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to ghcr.io
        env:
          REGISTRY_USERNAME: ${{ secrets.REGISTRY_USERNAME }}
          REGISTRY_PASSWORD: ${{ secrets.REGISTRY_PASSWORD }}
        run: |
          if [ -n "${REGISTRY_PASSWORD}" ]; then
            USER="${REGISTRY_USERNAME:-x}"
            echo "${REGISTRY_PASSWORD}" | docker login ghcr.io -u "${USER}" --password-stdin
          else
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u x --password-stdin
          fi

      - name: Build and push image
        env:
          REGISTRY: ghcr.io
        run: |
          set -euo pipefail
          REPO_NAME="${GITHUB_REPOSITORY##*/}"
          IMAGE="${REGISTRY}/${GITHUB_REPOSITORY_OWNER}/${REPO_NAME}"
          if [ "${GITHUB_REF}" = "refs/heads/main" ]; then
            TAG="main"
          else
            TAG="${GITHUB_REF_NAME}"
          fi
          docker build --pull --tag "${IMAGE}:${TAG}" .
          docker push "${IMAGE}:${TAG}"
